services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?请在.env设置已解析到服务器的域名}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ruanzhu:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
