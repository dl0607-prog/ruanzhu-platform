name: Build Windows 便携版

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r backend/requirements.txt pyinstaller

      # onedir 比 onefile 被杀软误报的概率低，便携性靠外层 zip 保证
      - name: 打包 exe
        run: >-
          pyinstaller --clean -y --onedir --name RuanZhuWorkshop
          --add-data "frontend;frontend"
          --collect-all uvicorn --collect-all docx
          --collect-all httpx --collect-all certifi
          --collect-all httpcore --collect-all h11
          run_win.py

      - name: 压缩便携包
        shell: pwsh
        run: Compress-Archive -Path dist\RuanZhuWorkshop\* -DestinationPath RuanZhuWorkshop-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ruanzhu-workshop-windows
          path: RuanZhuWorkshop-Windows.zip

  # 在 Windows 上真跑一遍打包产物:启动 exe → 建项目 → 传源码 → 分页统计 → 导出 docx
  smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ruanzhu-workshop-windows

      - name: 解压并启动 exe 跑业务用例
        shell: pwsh
        run: |
          Expand-Archive RuanZhuWorkshop-Windows.zip -DestinationPath portable -Force
          $proc = Start-Process -FilePath "portable\RuanZhuWorkshop.exe" -PassThru
          $healthy = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:8310/api/health" -TimeoutSec 3
              if ($h.ok) { $healthy = $true; break }
            } catch {}
          }
          if (-not $healthy) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw "exe 启动失败:health 检查超时" }
          Write-Host "health OK: llm_configured=$($h.llm_configured), kb_rules=$($h.kb_rules_total)"
          # 建项目 → 传源码 → 分页统计
          $proj = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8310/api/projects" -ContentType "application/json" -Body '{"full_name":"CI 冒烟用例系统","version":"V1.0","main_functions":"验证打包产物端到端可用"}'
          $content = Get-Content -Raw backend\tests\smoke_sample.py
          $body = @{ files = @(@{ filename = "smoke_sample.py"; content = $content }); replace = $true } | ConvertTo-Json -Depth 4
          $stored = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8310/api/projects/$($proj.id)/code" -ContentType "application/json" -Body $body
          Write-Host "代码入库: $($stored.files_stored) 个文件, $($stored.total_lines) 行, $($stored.pages_submitted) 页"
          if ($stored.total_lines -lt 20 -or $stored.pages_submitted -lt 1) { throw "分页统计异常" }
          # 合规审查(硬校验)与 docx 导出
          $rev = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8310/api/projects/$($proj.id)/review" -ContentType "application/json" -Body '{"include_llm":false}'
          Write-Host "合规审查: $($rev.blockers) 阻断, $($rev.warnings) 提醒"
          Invoke-WebRequest -Uri "http://127.0.0.1:8310/api/projects/$($proj.id)/export/source" -OutFile smoke-source.docx
          $size = (Get-Item smoke-source.docx).Length
          Write-Host "用例1 导出 docx: $size 字节"
          if ($size -lt 5000) { throw "导出 docx 异常(过小)" }
          # 用例2:全套打包导出 + 打印视图
          Invoke-WebRequest -Uri "http://127.0.0.1:8310/api/projects/$($proj.id)/export/bundle" -OutFile smoke-bundle.zip
          $bsize = (Get-Item smoke-bundle.zip).Length
          Write-Host "用例2 打包导出: $bsize 字节"
          if ($bsize -lt 3000) { throw "打包导出异常(过小)" }
          $print = Invoke-WebRequest -Uri "http://127.0.0.1:8310/api/projects/$($proj.id)/print/source" -UseBasicParsing
          if ($print.Content -notmatch "smoke_sample.py") { throw "打印视图未渲染源码" }
          Write-Host "用例2 打印视图: 已渲染源码, $($print.Content.Length) 字符"
          # 用例3:AI 设置保存与立即生效
          $set = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8310/api/settings" -ContentType "application/json" -Body '{"llm_base_url":"https://api.deepseek.com/v1","llm_model":"deepseek-chat"}'
          if ($set.llm_model -ne "deepseek-chat") { throw "设置保存未生效" }
          $set2 = Invoke-RestMethod -Uri "http://127.0.0.1:8310/api/settings"
          if ($set2.llm_base_url -ne "https://api.deepseek.com/v1") { throw "设置持久化异常" }
          Write-Host "用例3 AI 设置保存/读取: 通过"
          Invoke-RestMethod -Method Delete -Uri "http://127.0.0.1:8310/api/projects/$($proj.id)"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "冒烟用例全部通过(3 例)"
