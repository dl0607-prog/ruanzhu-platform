services:
  ruanzhu:
    build: .
    ports:
      - "127.0.0.1:8310:8310"
    env_file: .env
    volumes:
      - ruanzhu_data:/app/data
      - ruanzhu_exports:/app/exports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8310/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  ruanzhu_data:
  ruanzhu_exports:
