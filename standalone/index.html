<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软著工场 · 软著申请辅助平台</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%233b66f5'/%3E%3Cpath d='M10 20.5V11a1.5 1.5 0 0 1 1.5-1.5H17l5 4.5v6.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 10 20.5z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M13.5 16h5M13.5 19h3.5' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   软著工场 · 设计系统（原生 CSS，无构建依赖）
   亮 / 暗双主题：CSS 变量驱动，html[data-theme="dark"] 覆盖
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f2f4f8;
  --bg-soft: #edf0f6;
  --card: #ffffff;
  --card-2: #f8fafd;
  --line: #e6eaf1;
  --line-strong: #d7dde8;
  --text: #18213a;
  --text-2: #3d4966;
  --muted: #8792a8;

  --accent: #3b66f5;
  --accent-2: #2c50d4;
  --accent-soft: #ebf0ff;
  --accent-ring: rgba(59, 102, 245, .18);

  --ok: #149a5c;
  --ok-soft: #e3f6ec;
  --warn: #c07c08;
  --warn-soft: #fcf2dd;
  --danger: #dd4a4a;
  --danger-soft: #fdecec;
  --purple: #7a5af5;
  --purple-soft: #f0ecff;

  --sidebar-bg: #0e1730;
  --sidebar-bg-2: #111c3c;
  --sidebar-line: rgba(255, 255, 255, .07);
  --sidebar-text: #93a0bf;
  --sidebar-text-dim: #5c6a8d;

  --code-bg: #0f1730;
  --code-text: #c8d6f2;

  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 12px 32px -8px rgba(16, 24, 40, .18), 0 4px 10px -4px rgba(16, 24, 40, .08);
  --shadow-modal: 0 24px 64px -12px rgba(10, 16, 34, .35);
  --font-mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}

html[data-theme="dark"] {
  --bg: #0b1120;
  --bg-soft: #0e1526;
  --card: #131c31;
  --card-2: #18233c;
  --line: #233049;
  --line-strong: #2d3c5c;
  --text: #e6ebf7;
  --text-2: #b4bfd8;
  --muted: #7482a0;

  --accent: #5b83ff;
  --accent-2: #7b9bff;
  --accent-soft: #1c2a52;
  --accent-ring: rgba(91, 131, 255, .28);

  --ok: #34c586;
  --ok-soft: #10321f;
  --warn: #e5a83c;
  --warn-soft: #33270d;
  --danger: #f26d6d;
  --danger-soft: #3a1a1c;
  --purple: #9d88ff;
  --purple-soft: #241f45;

  --sidebar-bg: #0a1022;
  --sidebar-bg-2: #0d142c;
  --code-bg: #0a1124;
  --code-text: #b9c9ec;

  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-lg: 0 12px 32px -8px rgba(0, 0, 0, .5);
  --shadow-modal: 0 24px 64px -12px rgba(0, 0, 0, .6);
}

html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s;
}

::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

:is(button, input, select, textarea, a, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-radius: 6px;
}

/* ---------------- 布局骨架 ---------------- */
.layout { display: flex; min-height: 100vh; }

.sidebar {
  width: 232px; flex-shrink: 0;
  background: linear-gradient(180deg, var(--sidebar-bg), var(--sidebar-bg-2));
  color: var(--sidebar-text);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.logo { display: flex; align-items: center; gap: 11px; padding: 20px 18px 16px; border-bottom: 1px solid var(--sidebar-line); }
.logo-mark { width: 34px; height: 34px; flex-shrink: 0; filter: drop-shadow(0 3px 8px rgba(59, 102, 245, .45)); }
.logo-text .name { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: .5px; }
.logo-text .sub { font-size: 10.5px; color: var(--sidebar-text-dim); margin-top: 2px; letter-spacing: .3px; }

.nav { flex: 1; padding: 12px 12px 8px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: var(--radius-sm);
  cursor: pointer; margin-bottom: 3px; font-size: 13.5px; font-weight: 500;
  color: var(--sidebar-text); transition: background .15s, color .15s;
  position: relative;
}
.nav-item:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.nav-item.active {
  background: linear-gradient(135deg, var(--accent), #2c50d4);
  color: #fff; font-weight: 600;
  box-shadow: 0 4px 14px -4px rgba(59, 102, 245, .55);
}
.nav-item .ico, .proj-item .ico { width: 17px; height: 17px; display: inline-flex; flex-shrink: 0; }
.nav-item .ico svg, .proj-item .ico svg { width: 100%; height: 100%; }
.nav-section { font-size: 11px; color: var(--sidebar-text-dim); padding: 16px 12px 6px; letter-spacing: 1.5px; font-weight: 600; }

.proj-list { margin-top: 2px; }
.proj-item {
  padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 13px; color: var(--sidebar-text);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  transition: background .15s, color .15s;
}
.proj-item:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.proj-item.active { background: rgba(255, 255, 255, .09); color: #fff; box-shadow: inset 2.5px 0 0 var(--accent); }
.proj-item .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-item .v { font-size: 11px; color: var(--sidebar-text-dim); flex-shrink: 0; font-family: var(--font-mono); }
.proj-empty { padding: 8px 12px; font-size: 12px; color: var(--sidebar-text-dim); }

.nav-add {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  width: 100%; margin-top: 10px; padding: 9px;
  border: 1px dashed rgba(255, 255, 255, .18); border-radius: var(--radius-sm);
  background: transparent; color: var(--sidebar-text);
  font-size: 13px; font-family: inherit; cursor: pointer; transition: all .15s;
}
.nav-add:hover { border-color: var(--accent); color: #fff; background: rgba(59, 102, 245, .14); }
.nav-add .ico { width: 15px; height: 15px; display: inline-flex; }
.nav-add .ico svg { width: 100%; height: 100%; }

.sidebar-foot { padding: 14px 16px; border-top: 1px solid var(--sidebar-line); font-size: 11px; }
.foot-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px; border-radius: 20px;
  background: rgba(255, 255, 255, .05); color: var(--sidebar-text);
  font-size: 10.5px; margin-bottom: 9px;
}
.foot-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.foot-links a { color: var(--sidebar-text-dim); text-decoration: none; }
.foot-links a:hover { color: var(--sidebar-text); }

.main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 62px; background: var(--card);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 26px; position: sticky; top: 0; z-index: 20;
  transition: background .25s;
}
.topbar h1 { font-size: 16.5px; font-weight: 700; letter-spacing: .2px; }
.topbar .crumb { color: var(--muted); font-size: 12px; margin-top: 1px; }
.topbar-actions { display: flex; gap: 10px; align-items: center; }

.content { padding: 26px; max-width: 1180px; width: 100%; margin: 0 auto; animation: pageIn .25s ease; }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------------- 图标与按钮 ---------------- */
.ico { display: inline-flex; width: 16px; height: 16px; flex-shrink: 0; }
.ico svg { width: 100%; height: 100%; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 8.5px 17px; font-size: 13.5px; font-weight: 500; font-family: inherit;
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn .ico { width: 15px; height: 15px; }
.btn-primary { background: linear-gradient(135deg, var(--accent), #2c50d4); color: #fff; box-shadow: 0 3px 10px -3px rgba(59, 102, 245, .5); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 5px 14px -3px rgba(59, 102, 245, .55); }
.btn-primary:active:not(:disabled) { transform: none; }
.btn-ghost { background: var(--card); color: var(--text-2); border-color: var(--line-strong); }
.btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
html[data-theme="dark"] .btn-ghost { background: var(--card-2); }
.btn-danger-ghost { background: var(--danger-soft); color: var(--danger); }
.btn-danger-ghost:hover:not(:disabled) { filter: brightness(.97); }
.btn-sm { padding: 5px 12px; font-size: 12.5px; border-radius: 8px; }
.btn-big { padding: 12px 26px; font-size: 14.5px; border-radius: 11px; font-weight: 600; }

.icon-btn {
  width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line-strong);
  background: var(--card); color: var(--text-2); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.icon-btn .ico { width: 16px; height: 16px; }

/* ---------------- 卡片与栅格 ---------------- */
.card {
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--line); box-shadow: var(--shadow);
  padding: 22px; margin-bottom: 18px;
  transition: background .25s, border-color .25s;
}
.card h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; letter-spacing: .2px; }
.card h3 .hint { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: auto; text-align: right; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 920px) { .grid-2 { grid-template-columns: 1fr; } }

/* ---------------- 表单 ---------------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 720px) { .form-grid { grid-template-columns: 1fr; } }
.field label { display: block; font-size: 12px; color: var(--text-2); font-weight: 500; margin-bottom: 6px; }
.field label b { color: var(--danger); margin-right: 2px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  padding: 9px 12px; font-size: 13.5px; font-family: inherit;
  background: var(--card-2); color: var(--text); outline: none;
  transition: border-color .15s, box-shadow .15s, background .25s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent); background: var(--card);
  box-shadow: 0 0 0 3px var(--accent-ring);
}
.field textarea { min-height: 92px; resize: vertical; line-height: 1.7; }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); }

/* 文档类型选择卡片（操作说明书 / 设计说明书） */
.radio-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.radio-card {
  border: 1.5px solid var(--line-strong); border-radius: 12px;
  padding: 13px 15px; cursor: pointer; transition: all .15s; background: var(--card);
}
.radio-card:hover { border-color: var(--accent); }
.radio-card.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-ring); }
.radio-card .rt { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; }
.radio-card .rd { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.55; }
.radio-card.active .rt { color: var(--accent); }

/* ---------------- 统计卡 ---------------- */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
@media (max-width: 880px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px 18px;
  display: flex; align-items: center; gap: 13px;
  transition: transform .15s, box-shadow .15s;
}
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.stat-ico {
  width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.stat-ico .ico { width: 19px; height: 19px; }
.stat-ico.blue { background: var(--accent-soft); color: var(--accent); }
.stat-ico.green { background: var(--ok-soft); color: var(--ok); }
.stat-ico.orange { background: var(--warn-soft); color: var(--warn); }
.stat-ico.purple { background: var(--purple-soft); color: var(--purple); }
.stat .num { font-size: 23px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat .lbl { font-size: 12px; color: var(--muted); margin-top: 1px; }

/* ---------------- 仪表盘 hero ---------------- */
.hero {
  position: relative; overflow: hidden;
  border-radius: var(--radius); margin-bottom: 18px;
  background: linear-gradient(120deg, #16224a 0%, #1d2f6b 45%, #2c50d4 100%);
  color: #fff; padding: 28px 30px;
  box-shadow: var(--shadow-lg);
}
html[data-theme="dark"] .hero { background: linear-gradient(120deg, #101a3a 0%, #17264f 50%, #22409e 100%); }
.hero::after {
  content: ""; position: absolute; right: -60px; top: -80px;
  width: 320px; height: 320px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, .14), transparent 65%);
}
.hero h2 { font-size: 20px; font-weight: 800; letter-spacing: .3px; margin-bottom: 6px; }
.hero p { font-size: 13px; color: rgba(255, 255, 255, .75); max-width: 640px; line-height: 1.8; }
.hero .hero-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
.hero .btn-hero {
  background: #fff; color: #1d2f6b; border: none; border-radius: 10px;
  padding: 10px 20px; font-size: 13.5px; font-weight: 700; font-family: inherit;
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: all .15s;
}
.btn-hero:hover { transform: translateY(-1px); box-shadow: 0 6px 18px -4px rgba(0, 0, 0, .35); }
.btn-hero.ghost { background: rgba(255, 255, 255, .12); color: #fff; border: 1px solid rgba(255, 255, 255, .25); }

.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
@media (max-width: 920px) { .steps { grid-template-columns: repeat(2, 1fr); } }
.step-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px;
  transition: transform .15s, box-shadow .15s;
}
.step-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.step-card .s-head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.step-card .s-no {
  width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0;
  background: var(--accent-soft); color: var(--accent);
  font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center;
}
.step-card .s-title { font-size: 13.5px; font-weight: 700; }
.step-card .s-desc { font-size: 12px; color: var(--muted); line-height: 1.65; }

/* ---------------- 标签 ---------------- */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 20px;
  font-size: 11.5px; font-weight: 600; line-height: 1.7;
}
.tag.gray { background: var(--bg-soft); color: var(--text-2); }
html[data-theme="dark"] .tag.gray { background: var(--card-2); }
.tag.blue { background: var(--accent-soft); color: var(--accent); }
.tag.green { background: var(--ok-soft); color: var(--ok); }
.tag.orange { background: var(--warn-soft); color: var(--warn); }
.tag.red { background: var(--danger-soft); color: var(--danger); }
.tag.purple { background: var(--purple-soft); color: var(--purple); }

.badge-llm { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 20px; font-size: 11.5px; font-weight: 600; }
.badge-llm .ico { width: 12px; height: 12px; }
.badge-llm.on { background: var(--ok-soft); color: var(--ok); }
.badge-llm.off { background: var(--warn-soft); color: var(--warn); }

/* ---------------- 审查问题条 ---------------- */
.issue {
  display: flex; gap: 11px; padding: 13px 15px;
  border-radius: 11px; margin-bottom: 9px; border: 1px solid transparent;
}
.issue.blocker { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 25%, transparent); }
.issue.warning { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.issue.pass { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
.issue.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.issue .lv {
  flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 2px 9px;
  height: fit-content; border-radius: 6px; letter-spacing: 1px;
}
.issue.blocker .lv { background: var(--danger); color: #fff; }
.issue.warning .lv { background: var(--warn); color: #fff; }
.issue.pass .lv { background: var(--ok); color: #fff; }
.issue.info .lv { background: var(--accent); color: #fff; }
.issue .msg { font-weight: 600; margin-bottom: 3px; font-size: 13.5px; }
.issue .fix { font-size: 12.5px; color: var(--text-2); line-height: 1.65; }

/* ---------------- 终端进度面板 ---------------- */
.progress-panel {
  background: var(--code-bg); border: 1px solid rgba(255, 255, 255, .06);
  border-radius: 12px; padding: 15px 17px; max-height: 340px; overflow-y: auto;
  font-family: var(--font-mono); font-size: 12px; line-height: 2; color: var(--code-text);
}
.progress-panel .ok { color: #43d6a2; }
.progress-panel .err { color: #ff8177; }
.progress-panel .run { color: #ffd479; }
.progress-panel .dim { color: #5c6a8d; }

/* ---------------- 表格 ---------------- */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left; padding: 9px 13px; background: var(--card-2);
  color: var(--muted); font-size: 12px; font-weight: 600;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
.table td { padding: 11px 13px; border-bottom: 1px solid var(--line); vertical-align: middle; line-height: 1.55; }
.table tbody tr { transition: background .12s; }
.table tbody tr:hover { background: var(--card-2); }
.table tr:last-child td { border-bottom: none; }
.table a { color: var(--accent); font-weight: 600; text-decoration: none; }
.table a:hover { text-decoration: underline; }

/* 迷你进度条（材料进度 x/6） */
.pbar { width: 90px; height: 6px; border-radius: 4px; background: var(--bg-soft); overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
html[data-theme="dark"] .pbar { background: var(--card-2); }
.pbar > i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), #6d8dff); transition: width .4s ease; }

/* ---------------- 弹窗 ---------------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 100; padding: 30px;
  background: rgba(10, 16, 34, .55);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--card); border-radius: 16px; width: 720px; max-width: 100%;
  max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: var(--shadow-modal);
  animation: popIn .2s cubic-bezier(.2, .9, .3, 1.2);
}
@keyframes popIn { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: none; } }
.modal-head {
  padding: 16px 22px; border-bottom: 1px solid var(--line);

}

.modal-close {
  cursor: pointer; width: 30px; height: 30px; border-radius: 8px;

  display: flex; align-items: center; justify-content: center; transition: all .15s;

/* ---------------- 页签 ---------------- */

.tab:hover { color: var(--accent); background: var(--accent-soft); }

/* Server-managed account sessions; no credentials stored in localStorage. */
async function requireLogin() {
  let user = await fetch('/api/auth/me').then(r => r.ok ? r.json() : null);
  if (!user) {
    await new Promise(resolve => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-mask';
      overlay.style.zIndex = '9999';
      overlay.innerHTML = `<form class="modal" style="max-width:440px"><div class="modal-head"><h3>登录软著工场</h3></div><div class="modal-body"><p>每个账号独立管理项目和申请材料。账号由管理员创建。</p><div class="field"><label>账号</label><input name="username" autocomplete="username" required maxlength="80"></div><div class="field"><label>密码</label><input name="password" type="password" autocomplete="current-password" required maxlength="256"></div><p class="login-error" role="alert"></p><button class="btn btn-primary" type="submit">登录</button></div></form>`;
      document.body.appendChild(overlay);
      overlay.querySelector('form').onsubmit = async e => {
        e.preventDefault();
        const button = overlay.querySelector('button');
        button.disabled = true;
        try {
          const form = new FormData(e.target);
          const response = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.fromEntries(form))});
          if (!response.ok) {
            const error = await response.json();
            throw new Error(typeof error.detail === 'string' ? error.detail : '请检查账号及密码，密码至少12位');
          }
          user = await fetch('/api/auth/me').then(r => r.ok ? r.json() : null);
          if (!user) throw new Error('会话未生效：服务器需使用 HTTPS；本机测试请设置 COOKIE_SECURE=false');
          overlay.remove(); resolve();
        } catch (error) { overlay.querySelector('.login-error').textContent = error.message; }
        finally { button.disabled = false; }
      };
    });
  }
  window.sessionUser = user;
  const bar = document.createElement('div');
  bar.className = 'row';
  bar.style.padding = '10px';
  const name = document.createElement('span'); name.textContent = user.username;
  const logout = document.createElement('button'); logout.className = 'btn btn-ghost btn-sm'; logout.textContent = '退出登录';
  logout.onclick = async () => { await fetch('/api/auth/logout', {method:'POST'}); location.reload(); };
  bar.append(name, logout);
  if (user.admin) {
    const add = document.createElement('button'); add.className = 'btn btn-ghost btn-sm'; add.textContent = '创建账号';
    add.onclick = () => {
      const modal = document.createElement('div'); modal.className = 'modal-mask';
      modal.innerHTML = `<form class="modal" style="max-width:440px"><div class="modal-body"><h3>创建成员账号</h3><div class="field"><label>账号（字母、数字、_.@-）</label><input name="username" required pattern="[A-Za-z0-9_.@-]+" maxlength="80"></div><div class="field"><label>初始密码（至少12位）</label><input name="password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></div><p role="alert"></p><button class="btn btn-primary">创建</button> <button type="button" class="btn close-account">取消</button></div></form>`;
      modal.querySelector('.close-account').onclick = () => modal.remove();
      modal.querySelector('form').onsubmit = async e => {
        e.preventDefault();
        const button = e.target.querySelector('button'); button.disabled = true;
        try {
          const res = await fetch('/api/auth/users', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});
          const data = await res.json();
          if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : '字段格式不正确');
          modal.remove(); toast('账号已创建');
        } catch (error) { modal.querySelector('[role="alert"]').textContent = error.message; }
        finally { button.disabled = false; }
      };
      document.body.appendChild(modal);
    };
    bar.append(add);
  }
  (document.querySelector('.sidebar') || document.body).appendChild(bar);
}

function icon(name, size) {

async function api(path, opts = {}) {
  if (!path.startsWith("/api/")) throw new Error("非法的 API 路径");
  const res = await fetch(API + path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    let detail = res.status;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return res.json();
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------------- 极简 Markdown 渲染 ---------------- */
function md2html(md) {
  const lines = String(md || "").split("\n");
  let html = "", inList = false, inTable = false;
  const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
  const closeTable = () => { if (inTable) { html += "</tbody></table>"; inTable = false; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); closeTable(); continue; }
    if (line.startsWith("|")) {
      const cells = line.split("|").slice(1, -1).map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
      if (!inTable) { closeList(); html += "<table><tbody>"; inTable = true; }
      html += "<tr>" + cells.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>";
      continue;
    }
    closeTable();
    const shot = line.match(/^【截图占位[:：](.+?)】$/);
    if (shot) { closeList(); html += `<div class="shot">${icon("camera")} 截图占位：${esc(shot[1])}</div>`; continue; }
    if (/^###\s/.test(line)) { closeList(); html += `<h3>${inline(line.slice(4))}</h3>`; continue; }
    if (/^##\s/.test(line)) { closeList(); html += `<h2>${inline(line.slice(3))}</h2>`; continue; }
    if (/^#\s/.test(line)) { closeList(); html += `<h1>${inline(line.slice(2))}</h1>`; continue; }
    if (/^[-*+]\s/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inline(line.slice(2))}</li>`;
      continue;
    }
    closeList();
    html += `<p>${inline(line)}</p>`;
  }
  closeList(); closeTable();
  return html;
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }
}

/* ---------------- SSE 读取 ---------------- */
async function consumeSSE(res, onEvent) {
  if (!res.ok) {
    const error = await res.json().catch(() => ({}));
    throw new Error(error.detail || '生成请求失败');
  }
  const reader = res.body.getReader();
  let completed = false;
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
      if (chunk.startsWith("data: ")) {
        const event = JSON.parse(chunk.slice(6));
        onEvent(event);
        if (event.status === 'error') throw new Error(event.message || '生成失败');
        if (event.step === 'pipeline' && event.status === 'done') completed = true;
      }
    }
  }
  if (!completed) throw new Error("生成连接提前结束，请检查已保存材料后重试");
}

/* ---------------- 自绘日期选择器（内嵌浏览器不支持原生日历控件） ---------------- */
function toISODate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function dateField(id, value, placeholder) {
  return `<div class="dp" id="dp-${id}">
    <input class="dp-input" id="${id}" readonly autocomplete="off"
      placeholder="${esc(placeholder || "点击选择日期")}" value="${esc(value || "")}">
    <div class="dp-pop"></div>
  </div>`;
}

function initDatePicker(root) {
  $$(".dp", root).forEach(dp => {
    const input = dp.querySelector(".dp-input");
    const pop = dp.querySelector(".dp-pop");
    if (!input || !pop) return;
    const build = () => {
      let y = +(dp.dataset.y || 0), m = +(dp.dataset.m || 0);
      if (!y) {
        const base = input.value ? new Date(input.value + "T00:00:00") : new Date();
        const ok = !isNaN(base.getTime());
        y = ok ? base.getFullYear() : new Date().getFullYear();
        m = ok ? base.getMonth() : new Date().getMonth();
        dp.dataset.y = y; dp.dataset.m = m;
      }
      const today = new Date();
      let html = `<div class="dp-head">
        <button type="button" class="dp-nav" data-step="-1">‹</button>
        <span class="dp-title">${y} 年 ${m + 1} 月</span>
        <button type="button" class="dp-nav" data-step="1">›</button></div>
        <div class="dp-grid">`;
      ["日", "一", "二", "三", "四", "五", "六"].forEach(w => { html += `<span class="dp-dow">${w}</span>`; });
      const firstDow = new Date(y, m, 1).getDay();
      const days = new Date(y, m + 1, 0).getDate();
      for (let i = 0; i < firstDow; i++) html += `<span class="dp-blank"></span>`;
      for (let d = 1; d <= days; d++) {
        const iso = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const cls = ["dp-day"];
        if (iso === input.value) cls.push("sel");
        if (iso === toISODate(today)) cls.push("today");
        html += `<button type="button" class="${cls.join(" ")}" data-v="${iso}">${d}</button>`;
      }
      html += `</div><div class="dp-foot">
        <button type="button" class="dp-today">今天：${toISODate(today)}</button>
        <button type="button" class="dp-clear">清除</button></div>`;
      pop.innerHTML = html;
    };
    const close = () => { pop.style.display = "none"; delete dp.dataset.y; delete dp.dataset.m; };
    input.addEventListener("click", e => {
      e.stopPropagation();
      $$(".dp-pop", root).forEach(pp => { pp.style.display = "none"; });
      if (pop.style.display === "block") { pop.style.display = "none"; return; }
      build();
      pop.style.display = "block";
    });
    pop.addEventListener("click", e => {
      const nav = e.target.closest(".dp-nav");
      if (nav) {
        let y = +(dp.dataset.y || new Date().getFullYear());
        let m = +(dp.dataset.m || new Date().getMonth()) + (+nav.dataset.step);
        if (m < 0) { m = 11; y -= 1; }
        if (m > 11) { m = 0; y += 1; }
        dp.dataset.y = y; dp.dataset.m = m;
        build();
      }
      const day = e.target.closest(".dp-day");
      if (day) { input.value = day.dataset.v; close(); }
      if (e.target.closest(".dp-today")) { input.value = toISODate(new Date()); close(); }
      if (e.target.closest(".dp-clear")) { input.value = ""; close(); }
      e.stopPropagation();
    });
    document.addEventListener("click", () => { pop.style.display = "none"; });
  });
}

function bindProjectEvents(p) {
  $$(".tab").forEach(t => t.onclick = () => { state.tab = t.dataset.tab; loadProjectView(); });
  const statusSel = $("#status-select");
  if (statusSel) statusSel.onchange = async () => {
    try {
      await api(`/api/projects/${p.id}/status`, { method: "PATCH", body: { status: statusSel.value } });
      p.status = statusSel.value;
      toast("状态已更新");
      refreshProjects();
    } catch (e) { toast(e.message, true); statusSel.value = p.status || "draft"; }
  };
  $("#hidden-file").onchange = async e => {
    const fs = e.target.files;
    if (!fs.length) return;
    const fd = new FormData();
    for (const f of fs) fd.append("files", f);
    toast("正在解析上传…");
    const input = e.target;
    input.disabled = true;
    try {
      const res = await fetch(`${API}/api/projects/${p.id}/code/upload`, { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "上传失败");
      toast(`已导入 ${data.files_stored} 个文件，共 ${data.total_lines} 行 → 将生成 ${data.pages_submitted} 页源代码文档`);
      await refreshProjects();
      if (state.currentId === p.id) { state.tab = "code"; await loadProjectView(); }
    } catch (e) { toast(e.message || "上传失败，请检查连接后重试", true); }
    finally { input.disabled = false; input.value = ""; }
  };
}

}

/* ---- 截图库：上传 / 匹配占位 / 删除 ---- */
async function loadShots(p) {
  const d = await api(`/api/projects/${p.id}/shots`).catch(() => ({ shots: [] }));
  const box = $("#shot-list");
  if (!box) return;
  box.innerHTML = d.shots.length ? d.shots.map(s => `
    <div class="shot-item">
      <img src="${esc(API + s.url)}" alt="${esc(s.label)}">
      <div class="shot-label" title="${esc(s.label)}">${esc(s.label)}</div>
      <button class="btn btn-danger-ghost btn-sm" data-delshot="${+s.id}">删除</button>
    </div>`).join("") : `<div class="muted">尚未上传截图。说明书里的【截图占位】导出时会保留为虚线框，上传同名截图后自动替换。</div>`;
  $$("[data-delshot]", box).forEach(b => b.onclick = async () => {
    await api(`/api/projects/${p.id}/shots/${b.dataset.delshot}`, { method: "DELETE" });
    loadShots(p);
  });
  // 从已生成的说明书中提取未替换的截图占位，点击可快速填入名称
  const phBox = $("#shot-placeholders");
  if (!phBox) return;
  const docTypes = (p.docs || []).map(d => d.doc_type);
  const docType = docTypes.includes("manual") ? "manual" : docTypes.includes("design") ? "design" : null;
  let labels = [];
  if (docType) {
    const doc = await api(`/api/projects/${p.id}/docs/${docType}`).catch(() => null);
    labels = [...String((doc || {}).content || "").matchAll(/【截图占位[:：](.+?)】/g)].map(m => m[1].trim());
  }
  phBox.innerHTML = labels.length
    ? `<span class="muted">说明书中待替换的占位（${labels.length} 个，点击填入名称）：</span>` +
      labels.map(l => `<span class="tag orange" data-ph="${esc(l)}" style="cursor:pointer;">${esc(l)}</span>`).join("")
    : (docType ? `<span class="muted">说明书中没有截图占位标记</span>` : `<span class="muted">生成说明书后，这里会列出全部待替换的截图占位</span>`);
  $$("[data-ph]", phBox).forEach(t => t.onclick = () => { $("#shot-label").value = t.dataset.ph; });
  const fileInput = $("#shot-file");
  $("#btn-shot-upload").onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const f = fileInput.files[0];
    if (!f) return;
    const label = $("#shot-label").value.trim() || f.name.replace(/\.[^.]+$/, "");
    const fd = new FormData();
    fd.append("file", f);
    fd.append("label", label);
    toast("正在上传截图…");
    const res = await fetch(`${API}/api/projects/${p.id}/shots`, { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) return toast(data.detail || "上传失败", true);
    toast(`截图已入库：${data.label}`);
    fileInput.value = "";
    loadShots(p);
  };
}

        <div id="ed-preview-box" class="md" style="display:none;max-height:460px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--card-2);"></div>

    if (docType === 'form') {

      fields.innerHTML = Object.entries(formFields).map(([key,label]) => `<div class="field full"><label>${label}</label><textarea data-form-field="${key}">${esc(data[key] || '')}</textarea></div>`).join('');
      $('#ed-content', m).style.display = 'none';
      $('#ed-content', m).before(fields);
      $('#ed-source', m).textContent = '返回表单';
    }
    const editedContent = () => docType === 'form' ? JSON.stringify(Object.fromEntries($$('[data-form-field]', m).map(el => [el.dataset.formField, el.value.trim()])), null, 2) : $('#ed-content', m).value;
    $(".modal-close", m).onclick = () => m.remove();
    m.onclick = e => { if (e.target === m) m.remove(); };
    $("#ed-preview", m).onclick = () => {
      $("#ed-content", m).style.display = "none";

      const fields = $("#ed-fields", m); if (fields) fields.style.display = "none";
      box.innerHTML = docType === "form" ? Object.entries(JSON.parse(editedContent())).map(([key,value]) => `<h3>${formFields[key] || esc(key)}</h3><p>${esc(value)}</p>`).join("") : md2html(editedContent());
      box.style.display = "block";

      $("#ed-preview-box", m).style.display = "none";
      if (docType === "form") $("#ed-fields", m).style.display = "grid";

        await api(`/api/projects/${pid}/docs/${docType}`, { method: "PUT", body: { content: editedContent() } });

        m.remove();
        refreshProjects().then(loadProjectView);
      } catch (e) { toast(e.message, true); }
      finally { save.disabled = false; }
    };
  } catch (e) { toast(e.message, true); }
}

async function previewDoc(pid, docType) {

function openModal(title, html) {
  const m = document.createElement("div");
  m.className = "modal-mask";
  m.innerHTML = `<div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close">${icon("x")}</button></div>
    <div class="modal-body md">${html}</div></div>`;
  document.body.appendChild(m);
  $(".modal-close", m).onclick = () => m.remove();
  m.onclick = e => { if (e.target === m) m.remove(); };
}

async function tabReview(p, body) {
  body.innerHTML = `

    </div>
    <div id="review-result" class="mt"></div>
  </div>
  <div class="card"><h3>${icon("clock", 16)} 历史审查记录</h3><div id="review-history"><div class="empty">加载中…</div></div></div>`;

  const checks = document.createElement('div'); checks.className = 'card';
  checks.innerHTML = `<h3>最后三项确认</h3><p class="muted">${checklist.stale ? '材料已变化或尚未核对，请重新确认。' : '已保存当前材料的核对结果。'}这些事项无法仅靠自动审查确认。</p>${Object.entries(checklist.items).map(([key,label]) => `<label class="kbd-line"><input type="checkbox" data-check="${key}" ${checklist.checks[key] ? 'checked' : ''}> ${esc(label)}</label>`).join('')}<div class="field mt"><label>补正通知指定截止日期（收到通知后填写）</label><input type="date" id="correction-due" value="${esc(checklist.correction_due || '')}"></div><div class="field"><label>补正逐项处理记录</label><textarea id="correction-notes">${esc(checklist.correction_notes || '')}</textarea></div><button class="btn btn-primary mt" id="save-checks">保存确认</button>`;
  body.prepend(checks);
  $('#save-checks', checks).onclick = async () => {
    const btn = $('#save-checks', checks); btn.disabled = true;
    try {
      await api(`/api/projects/${p.id}/submission`, {method:'PUT', body:{checks:Object.fromEntries($$('[data-check]', checks).map(el => [el.dataset.check, el.checked])), correction_due:$('#correction-due', checks).value, correction_notes:$('#correction-notes', checks).value}});
      toast('已保存，请重新运行预检');
    } catch (e) { toast(e.message, true); }
    finally { btn.disabled = false; }
  };
  const reports = await api(`/api/projects/${p.id}/reports`).catch(() => ({ reports: [] }));
  $("#review-history").innerHTML = reports.reports.length ? `<div class="table-wrap"><table class="table">
    <thead><tr><th>时间</th><th>结论</th><th>阻断项</th><th>提醒项</th><th></th></tr></thead><tbody>
    ${reports.reports.map(r => `<tr><td>${esc(r.created_at)}</td>
      <td><span class="tag ${r.passed ? "green" : "red"}">${r.passed ? "通过" : "未通过"}</span></td>
      <td>${r.blockers}</td><td>${r.warnings}</td>
      <td><button class="btn btn-ghost btn-sm" data-rep="${r.id}">${icon("eye", 13)} 查看</button></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">暂无记录</div>`;
  $$("[data-rep]", body).forEach(b => b.onclick = async () => {
    const r = await api(`/api/projects/${p.id}/reports/${b.dataset.rep}`);
    renderReport(r.issues || JSON.parse(r.result_json || "[]"), r.passed);
  });
  $("#btn-review").onclick = async () => {
    const btn = $("#btn-review"); btn.disabled = true; btn.textContent = "审查中…";
    $("#review-result").innerHTML = `<div class="empty">正在逐项检查…</div>`;
    try {
      const r = await api(`/api/projects/${p.id}/review`, { method: "POST", body: { include_llm: true } });
      renderReport(r.issues, r.passed);
      if (!(state.health && state.health.llm_configured)) toast("提示：未配置 LLM，仅执行硬校验（配置后可加 AI 软审查）");
    } catch (e) { $("#review-result").innerHTML = ""; toast(e.message, true); }
    btn.disabled = false; btn.innerHTML = `${icon("shield", 16)} 检查我的材料`;
  };
  function renderReport(issues, passed) {
    const blockers = issues.filter(i => i.level === "blocker");
    const warnings = issues.filter(i => i.level === "warning");
    $("#review-result").innerHTML = `
      <div class="issue ${passed ? "pass" : "blocker"}">
        <span class="lv">${passed ? "自动检查通过" : "需处理问题"}</span>
        <div><div class="msg">${passed ? "自动检查未发现阻断项，仍需核对权属、签章及官网要求" : `仍有 ${blockers.length} 个阻断项，修复后再提交`}</div>
        <div class="fix">阻断 ${blockers.length} · 提醒 ${warnings.length}。最终以版权中心审查为准；提交前建议用真实 Git 记录复核开发过程。</div></div>
      </div>
      ${blockers.concat(warnings).map(i => `
        <div class="issue ${i.level}">
          <span class="lv">${i.level === "blocker" ? "阻断" : "提醒"}</span>
          <div><div class="msg">${esc(i.message)}</div><div class="fix">${icon("arrow", 12)} ${esc(i.suggestion || "—")}${i.source === "knowledge_base" ? `　<span class="tag blue">知识库规则</span>` : i.source === "llm" ? `　<span class="tag orange">AI 软审查</span>` : ""}</div></div>
        </div>`).join("")}`;
  }
}

    window.open(`${API}/api/projects/${p.id}/print/${b.dataset.print}`, "_blank");
  });
  const DL_KINDS = ["source", "manual", "form", "evidence", "bundle"];
  $$("[data-dl]", body).forEach(b => b.onclick = () => {
    const kind = b.dataset.dl;
    if (!DL_KINDS.includes(kind)) return;
    const url = kind === "bundle" ? `${API}/api/projects/${p.id}/export/bundle` : `${API}/api/projects/${p.id}/export/${kind}`;
    fetch(url).then(res => {
      if (!res.ok) return res.json().then(d => { throw new Error(d.detail || "导出失败"); });
      return res.blob().then(blob => {
        const dispo = res.headers.get("content-disposition") || "";
        let name = "download.docx";
        const m = dispo.match(/filename\*?=(?:UTF-8'')?"?([^";]+)/i);
        if (m) name = decodeURIComponent(m[1]);
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = name; a.click();
        URL.revokeObjectURL(a.href);
      });
    }).catch(e => toast(e.message, true));
  });
}

/* ---------------- 主题 ---------------- */
function initTheme() {
  const btn = $("#btn-theme");
  if (!btn) return;
  const paint = () => { btn.innerHTML = icon(document.documentElement.dataset.theme === "dark" ? "sun" : "moon"); };
  btn.onclick = () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("rz-theme", next); } catch (e) {}
    paint();
  };
  paint();
}

/* ---------------- 启动 ---------------- */
async function boot() {
  if (location.protocol !== "file:") await requireLogin();
  hydrateIcons();
  initTheme();
  // 单文件预览模式（standalone/index.html 直接 file:// 打开）给出明确提示
  if (location.protocol === "file:") {
    const b = document.createElement("div");
    b.className = "demo-banner";
    b.innerHTML = "当前为<b>单文件预览模式</b>（file:// 直接打开）：数据接口不可用，仅展示界面骨架。完整功能请运行 <b>./start.sh</b> 后访问 <b>http://127.0.0.1:8310</b>。";
    document.body.prepend(b);
  }
  try { state.health = await api("/api/health"); } catch (e) {}
  const h = state.health;
  $("#llm-badge").innerHTML = h && h.llm_configured
    ? `<span class="badge-llm on">${icon("check", 12)} AI 已连接 · ${esc(h.llm_model || "")}</span>`
    : `<span class="badge-llm off" title="在项目根目录 .env 配置 LLM_API_KEY 后可使用 AI 生成">${icon("alert", 12)} AI 未配置</span>`;
  try { await refreshProjects(); }
  catch (e) {
    $("#proj-list").innerHTML = `<div class="proj-empty">服务未连接</div>`;
    setPage("服务未连接", "请确认后端已启动（./start.sh）");
  }
  const m = location.hash.match(/^#\/project\/(\d+)/);
  if (location.hash === "#/index") { showIndex(); return; }
  if (m && state.projects.some(p => p.id === +m[1])) { state.currentId = +m[1]; loadProjectView(); }
  else showDashboard();
}

$("#btn-new-top").onclick = () => openProjectModal(null);
$("#btn-new-side").onclick = () => openProjectModal(null);
$("#btn-home").onclick = () => showDashboard();
$("#btn-index").onclick = () => showIndex();
window.openProject = openProject;
boot();

</script>
